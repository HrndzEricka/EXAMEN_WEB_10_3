<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prueba Comprensiva — Ciberseguridad 10°</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --navy:#0F1E3D;
  --navy-2:#182C54;
  --gold:#C9A227;
  --gold-dim:#E7D9A8;
  --cream:#F5F1E6;
  --paper:#FBF9F3;
  --ink:#181A1F;
  --slate:#5B6472;
  --line:#DCD4BE;
  --danger:#A5402A;
  --good:#3E6B52;
  --radius:3px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--cream);
  color:var(--ink);
  font-family:'IBM Plex Sans', sans-serif;
  font-size:17px;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
#app{min-height:100vh;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16.5px;}

/* ---------- shared layout bits ---------- */
.wrap{max-width:880px;margin:0 auto;padding:0 20px;}
.topbar{
  background:var(--navy);
  color:var(--paper);
  border-bottom:3px solid var(--gold);
}
.topbar-inner{
  max-width:880px;margin:0 auto;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.brand{font-weight:700;font-size:18px;letter-spacing:.2px;}
.brand small{display:block;font-family:'IBM Plex Sans';font-weight:400;font-size:12px;color:var(--gold-dim);margin-top:2px;}
.btn{
  border:1px solid var(--navy);
  background:var(--navy);
  color:var(--paper);
  padding:10px 18px;
  border-radius:var(--radius);
  font-weight:600;
  font-size:14px;
  transition:transform .08s ease;
}
.btn:hover{transform:translateY(-1px);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.btn-gold{background:var(--gold);border-color:var(--gold);color:var(--navy);}
.btn-ghost{background:transparent;border:1px solid var(--slate);color:var(--ink);}
.btn-ghost-nav{background:transparent;border:1px solid rgba(255,255,255,.5);color:var(--paper);}
.btn-ghost-nav:hover{border-color:var(--gold);color:var(--gold-dim);}
.btn-danger{background:var(--danger);border-color:var(--danger);}
.btn-small{padding:6px 12px;font-size:13px;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:var(--slate);margin-bottom:5px;text-transform:none;}
.field input[type=text], .field select{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);color:var(--ink);
}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--navy-2);outline-offset:1px;}
.hint{font-size:12.5px;color:var(--slate);margin-top:4px;}

/* ---------- landing / cover ---------- */
.cover{
  background:var(--navy);color:var(--paper);
  padding:56px 20px 70px;
  position:relative;
}
.cover-inner{max-width:600px;margin:0 auto;}
.cover .tag{font-family:'IBM Plex Mono';font-size:12px;color:var(--gold);letter-spacing:.5px;margin-bottom:14px;}
.cover h1{font-size:34px;line-height:1.15;margin:0 0 8px;}
.cover p.sub{color:var(--gold-dim);font-size:16px;margin:0 0 28px;}
.cover-meta{border-top:1px solid rgba(255,255,255,.18);padding-top:18px;font-size:13.5px;color:#C9CEDC;display:grid;grid-template-columns:1fr 1fr;gap:6px 20px;}
.card{
  background:var(--paper);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:40px 28px 28px;
  margin:-24px auto 40px;
  max-width:600px;
  box-shadow:0 10px 30px -18px rgba(15,30,61,.35);
  position:relative;
  z-index:2;
}
.locked{
  max-width:600px;margin:-40px auto 40px;background:var(--paper);border:1px dashed var(--slate);
  border-radius:var(--radius);padding:32px;text-align:center;color:var(--slate);
}
.footer-link{text-align:center;padding:24px 0 40px;font-size:13px;color:var(--slate);}
.footer-link button{background:none;border:none;color:var(--slate);text-decoration:underline;font-size:13px;}

/* ---------- exam ---------- */
.stickybar{
  position:sticky;top:0;z-index:20;
  background:var(--navy);color:var(--paper);
  border-bottom:3px solid var(--gold);
}
.stickybar-inner{
  max-width:880px;margin:0 auto;padding:10px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;
}
.timer{font-family:'IBM Plex Mono';font-size:18px;font-weight:600;color:var(--gold);}
.timer.warn{color:#E2836A;}
.progress-badge{font-family:'IBM Plex Mono';font-size:12.5px;color:#C9CEDC;}

.section{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin:38px 0;overflow:hidden;}
.section-head{
  background:var(--navy);color:var(--paper);padding:14px 20px;
  display:flex;align-items:baseline;gap:12px;
}
.section-head .num{font-family:'IBM Plex Mono';color:var(--gold);font-weight:600;font-size:15px;}
.section-head h2{margin:0;font-size:17px;}
.section-head .pts{margin-left:auto;font-family:'IBM Plex Mono';font-size:13px;color:var(--gold-dim);}
.section-instr{padding:18px 24px;font-size:15px;color:var(--slate);border-bottom:1px solid var(--line);background:#F1ECDD;}
.section-body{padding:26px;}

.q{padding:28px 0;border-bottom:1px solid var(--line);}
.q:last-child{border-bottom:none;}
.q-text{font-size:16.5px;margin-bottom:18px;white-space:pre-line;line-height:1.6;}
.q-num{font-family:'IBM Plex Mono';color:var(--navy-2);font-weight:600;margin-right:6px;}
.options{display:flex;gap:12px;flex-wrap:wrap;}
.option{
  border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;
  display:flex;align-items:center;gap:10px;cursor:pointer;background:var(--paper);
  font-size:16px;flex:1 1 220px;
}
.option:has(input:checked){border-color:var(--navy);background:#EFE9D8;}
.option .k{font-family:'IBM Plex Mono';font-weight:600;color:var(--navy-2);}
.option input{accent-color:var(--navy);}

textarea{
  width:100%;min-height:70px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius);
  background:var(--paper);resize:vertical;
}
.pts-tag{font-family:'IBM Plex Mono';font-size:13.5px;color:var(--slate);margin-left:6px;}

.blank-row{display:flex;flex-direction:column;gap:12px;}
.blank-item{display:flex;align-items:center;gap:10px;}
.blank-num{font-family:'IBM Plex Mono';font-weight:600;color:var(--navy-2);width:20px;flex-shrink:0;font-size:16px;}
.blank-input{flex:1;padding:13px 14px;font-size:16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}

.colA{background:#F1ECDD;border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;font-size:15px;}
.colA-title{font-weight:600;margin-bottom:10px;color:var(--navy-2);}
.colA-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 20px;}
.match-row{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);}
.match-row:last-child{border-bottom:none;}
.match-row .txt{flex:1;font-size:16px;}
.match-row select{width:180px;padding:11px;font-size:15px;border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);}

.case-box{background:#EFE9D8;border-left:3px solid var(--gold);padding:14px 16px;margin-bottom:16px;font-size:14px;}

.submitbar{display:flex;justify-content:flex-end;gap:10px;margin:30px 0 60px;}

/* ---------- submitted screen ---------- */
.result-card{max-width:600px;margin:60px auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:32px;text-align:center;}
.result-card .big{font-family:'Space Grotesk';font-size:40px;color:var(--navy);margin:6px 0;}
.score-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0;text-align:left;}
.score-item{border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:#F1ECDD;}
.score-item .lbl{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.4px;}
.score-item .val{font-family:'IBM Plex Mono';font-size:20px;font-weight:600;color:var(--navy-2);}
.pending{color:var(--slate);font-style:italic;}

/* ---------- teacher ---------- */
.teacher-login{max-width:380px;margin:80px auto;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:28px;}
.tpanel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin:20px 0;padding:20px;}
.tpanel h3{margin-top:0;font-size:16px;color:var(--navy-2);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
.toggle-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.switch{position:relative;width:44px;height:24px;background:var(--slate);border-radius:12px;cursor:pointer;flex-shrink:0;}
.switch.on{background:var(--good);}
.switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;background:#fff;border-radius:50%;transition:left .15s;}
.switch.on .knob{left:22px;}

table.subs{width:100%;border-collapse:collapse;font-size:13.5px;}
table.subs th{text-align:left;background:var(--navy);color:var(--paper);padding:9px 10px;font-weight:600;font-size:12.5px;}
table.subs td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top;}
table.subs tr:hover td{background:#F1ECDD;}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11.5px;font-weight:600;font-family:'IBM Plex Mono';}
.badge.pend{background:#F1D9CE;color:var(--danger);}
.badge.done{background:#D9E7DE;color:var(--good);}

.detail{background:#F1ECDD;border-top:2px solid var(--gold);padding:18px;}
.detail h4{margin:14px 0 8px;font-size:14px;color:var(--navy-2);}
.detail .a-item{margin-bottom:10px;font-size:13.5px;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;}
.detail .a-item .prompt{color:var(--slate);font-size:12.5px;margin-bottom:4px;}
.grade-input{width:60px;padding:6px 8px;border:1px solid var(--line);border-radius:var(--radius);margin-left:8px;}

.toolbar{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;align-items:center;margin-bottom:14px;}

@media (max-width:640px){
  .cover h1{font-size:26px;}
  .cover-meta{grid-template-columns:1fr;}
  .score-grid{grid-template-columns:1fr;}
  .grid2{grid-template-columns:1fr;}
  .colA-grid{grid-template-columns:1fr;}
  table.subs{font-size:12px;}
}

/* ---------- anti-cheat overlay ---------- */
.cheat-overlay{
  position:fixed;inset:0;z-index:999;background:rgba(15,30,61,.92);
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.cheat-box{
  background:var(--paper);border-radius:var(--radius);padding:32px;max-width:440px;text-align:center;
  border-top:4px solid var(--danger);
}
.cheat-box h3{margin-top:0;color:var(--danger);}
.cheat-box p{color:var(--ink);font-size:14.5px;}
.cheat-box .btn{margin-top:14px;}

/* ---------- versión imprimible ---------- */
.print-page{max-width:800px;margin:0 auto;padding:20px;background:#fff;color:#111;font-family:'IBM Plex Sans',sans-serif;}
.print-page h1,.print-page h2,.print-page h3{font-family:'Space Grotesk',sans-serif;color:#111;}
.print-header{text-align:center;border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:18px;}
.print-header h1{margin:8px 0 2px;font-size:22px;}
.print-header .sub{font-size:13px;color:#444;}
.print-admin{display:grid;grid-template-columns:1fr 1fr;gap:6px 24px;font-size:13px;border:1px solid #999;padding:12px 16px;margin-bottom:22px;}
.print-admin div{border-bottom:1px dotted #999;padding:4px 0;}
.print-section-title{background:#111;color:#fff;padding:6px 12px;font-size:14px;font-weight:600;margin:22px 0 4px;}
.print-instr{font-size:12.5px;color:#333;font-style:italic;margin-bottom:10px;}
.print-q{font-size:13px;margin-bottom:12px;page-break-inside:avoid;}
.print-q .qn{font-weight:600;margin-right:4px;}
.print-opts{margin:4px 0 0 18px;}
.print-opts div{margin-bottom:2px;}
.print-blank{border-bottom:1px solid #333;display:inline-block;min-width:220px;margin-left:4px;}
.print-cols{display:flex;gap:24px;font-size:13px;}
.print-cols .colA{background:none;border:1px solid #999;flex:1;}
.print-cols .colB{flex:1.4;}
.print-match{display:flex;gap:6px;margin-bottom:8px;font-size:12.5px;align-items:baseline;}
.print-match .paren{font-family:'IBM Plex Mono';}
.print-spec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;}
.print-spec th,.print-spec td{border:1px solid #999;padding:5px 8px;text-align:left;}
.print-spec th{background:#eee;}
.print-toolbar{max-width:800px;margin:16px auto;display:flex;gap:10px;justify-content:flex-end;}
@media print{
  .print-toolbar, .topbar{display:none !important;}
  body{background:#fff;}
  .print-page{max-width:none;padding:0;}
  .print-section-title{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

/* ---------- RR / RSC / ID ---------- */
.rubric{background:#F1ECDD;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:13.5px;color:var(--slate);margin-top:10px;}
.rubric-title{font-weight:600;color:var(--navy-2);margin-bottom:4px;}
.pending-tag{display:inline-block;background:#F1D9CE;color:var(--danger);font-family:'IBM Plex Mono';font-size:11px;font-weight:600;padding:2px 8px;border-radius:12px;margin-left:8px;}
.code-box{background:#0F1E3D;color:#E7D9A8;font-family:'IBM Plex Mono',monospace;font-size:14px;padding:16px 18px;border-radius:var(--radius);margin-bottom:18px;white-space:pre;overflow-x:auto;line-height:1.6;}
.code-box .ln{color:#7C8BAE;margin-right:10px;user-select:none;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ============================================================
   DATA — Prueba Comprensiva Ciberseguridad — 10-3
   SU 25 + RC 15 + C 10 = 50 puntos
   ============================================================ */
const TEMA_NOMBRES = {
  tema1:"Amenazas, Vulnerabilidades y Ataques a la Ciberseguridad",
  tema2:"Windows — Sistema Operativo",
  tema3:"Linux — Sistema Operativo",
  tema4:"Protección de Sistemas, Redes y Control de Acceso"
};

const PART_SU = [
 {id:1, tema:"tema1", text:"Analice el siguiente texto:\n\"El atacante crea una historia falsa y creíble para ganarse la confianza de la víctima antes de pedirle información.\"\n\n¿A qué técnica de ingeniería social corresponde?", code:null, options:[["A","Baiting"],["B","Pretexting"],["C","Tailgating"]], correct:"B"},
 {id:2, tema:"tema1", text:"¿Cuál ataque consiste en probar miles o millones de combinaciones de contraseñas de forma automatizada?", code:null, options:[["A","Fuerza bruta"],["B","Phishing"],["C","Man-in-the-Middle"]], correct:"A"},
 {id:3, tema:"tema1", text:"¿Qué tipo de malware cifra los archivos de la víctima y exige un pago económico para restaurarlos?", code:null, options:[["A","Spyware"],["B","Ransomware"],["C","Troyano"]], correct:"B"},
 {id:4, tema:"tema1", text:"Analice el siguiente texto:\n\"Un atacante se interpone entre dos usuarios que se comunican, interceptando y modificando los mensajes sin que ninguno lo note.\"\n\n¿A qué ataque corresponde?", code:null, options:[["A","DDoS"],["B","Man-in-the-Middle"],["C","SYN Flood"]], correct:"B"},
 {id:5, tema:"tema1", text:"¿Cuál técnica de ingeniería social consiste en seguir físicamente a un empleado autorizado para entrar a una instalación?", code:null, options:[["A","Tailgating"],["B","Smishing"],["C","Vishing"]], correct:"A"},
 {id:6, tema:"tema1", text:"¿Qué vulnerabilidad permite insertar código SQL malicioso en formularios para acceder o modificar una base de datos sin autorización?", code:null, options:[["A","Cross-Site Scripting (XSS)"],["B","CSRF"],["C","Inyección SQL"]], correct:"C"},
 {id:7, tema:"tema1", text:"¿Cuál versión del protocolo IP tiene direcciones de 128 bits y un encabezado de tamaño fijo (40 bytes)?", code:null, options:[["A","IPv4"],["B","IPv6"],["C","TCP"]], correct:"B"},
 {id:8, tema:"tema1", text:"¿Qué ataque satura servidores o redes con millones de peticiones simultáneas desde múltiples equipos infectados (botnet)?", code:null, options:[["A","DDoS"],["B","Phishing"],["C","Ransomware"]], correct:"A"},
 {id:9, tema:"tema2", text:"¿En cuál modo de Windows se ejecutan las aplicaciones del usuario (navegadores, procesadores de texto), con acceso limitado al hardware?", code:null, options:[["A","Modo Kernel"],["B","Modo Usuario"],["C","Modo Administrador"]], correct:"B"},
 {id:10, tema:"tema2", text:"¿Cuál herramienta de Windows cifra el disco completo para proteger la información en caso de robo o pérdida del dispositivo?", code:null, options:[["A","BitLocker"],["B","Microsoft Defender"],["C","UAC"]], correct:"A"},
 {id:11, tema:"tema2", text:"¿Qué componente es el núcleo del sistema operativo Windows, con acceso total al hardware?", code:null, options:[["A","NTFS"],["B","Kernel"],["C","Firewall de Windows"]], correct:"B"},
 {id:12, tema:"tema2", text:"¿Cuál herramienta de Windows solicita autorización cuando un programa intenta realizar cambios importantes en el sistema?", code:null, options:[["A","UAC (Control de Cuentas de Usuario)"],["B","Windows Update"],["C","BitLocker"]], correct:"A"},
 {id:13, tema:"tema2", text:"¿Qué atajo de teclado abre el Administrador de Tareas en Windows?", code:null, options:[["A","Ctrl + Alt + Supr"],["B","Ctrl + Shift + Esc"],["C","Alt + F4"]], correct:"B"},
 {id:14, tema:"tema2", text:"¿Cuál sistema de archivos moderno de Windows permite permisos de seguridad, cifrado y compresión?", code:null, options:[["A","FAT32"],["B","NTFS"],["C","ext4"]], correct:"B"},
 {id:15, tema:"tema3", text:"¿Quién creó Linux en 1991?", code:null, options:[["A","Bill Gates"],["B","Linus Torvalds"],["C","Dennis Ritchie"]], correct:"B"},
 {id:16, tema:"tema3", text:"¿Cuál es el administrador principal del sistema en Linux, con acceso total a todos los recursos?", code:null, options:[["A","Root"],["B","Usuario estándar"],["C","Grupo"]], correct:"A"},
 {id:17, tema:"tema3", text:"¿Cuál comando de Linux muestra el directorio en el que se encuentra actualmente el usuario?", code:null, options:[["A","ls"],["B","pwd"],["C","cd"]], correct:"B"},
 {id:18, tema:"tema3", text:"En el permiso -rwxr-xr--, ¿qué acceso tiene el grupo (segundo bloque de tres letras)?", code:null, options:[["A","Lectura y escritura"],["B","Lectura y ejecución"],["C","Solo ejecución"]], correct:"B"},
 {id:19, tema:"tema3", text:"¿Cuál shell es el más utilizado por defecto en la mayoría de distribuciones Linux?", code:null, options:[["A","Bash"],["B","PowerShell"],["C","Zsh"]], correct:"A"},
 {id:20, tema:"tema3", text:"¿Cuál distribución de Linux está especializada en ciberseguridad y pruebas de penetración?", code:null, options:[["A","Ubuntu"],["B","Kali Linux"],["C","Fedora"]], correct:"B"},
 {id:21, tema:"tema2", text:"¿Cuál herramienta de Windows registra errores del sistema, advertencias y eventos de seguridad, como intentos de acceso no autorizados?", code:null, options:[["A","Monitor de Rendimiento"],["B","Visor de Eventos"],["C","Administrador de Dispositivos"]], correct:"B"},
 {id:22, tema:"tema2", text:"¿Cuál herramienta de Windows permite un análisis detallado del uso de CPU, disco, memoria y red para detectar cuellos de botella en el sistema?", code:null, options:[["A","Administrador de Tareas"],["B","Monitor de Rendimiento"],["C","Visor de Eventos"]], correct:"B"},
 {id:23, tema:"tema4", text:"En el modelo AAA, ¿cuál de los tres procesos responde a la pregunta \"¿qué hiciste?\" (registro de actividades)?", code:null, options:[["A","Authentication"],["B","Authorization"],["C","Accounting"]], correct:"C"},
 {id:24, tema:"tema4", text:"¿Cuál zona de red aloja servidores públicos (web, correo), separada de la red interna de confianza?", code:null, options:[["A","LAN"],["B","DMZ"],["C","VLAN"]], correct:"B"},
 {id:25, tema:"tema4", text:"¿Qué protocolo reemplaza al inseguro Telnet, ofreciendo acceso remoto cifrado a servidores y equipos de red?", code:null, options:[["A","SSH"],["B","FTP"],["C","SNMP"]], correct:"A"}
];

const PART_RC = [
 {id:1, tema:"tema1", text:"Anote 3 técnicas de ingeniería social vistas en clase.", max:3, ref:"Lista cerrada: phishing, pretexting, baiting, tailgating, smishing, vishing",
   sets:[["phishing"],["pretexting"],["baiting"],["tailgating"],["smishing"],["vishing"]]},
 {id:2, tema:"tema2", text:"Anote 2 herramientas de seguridad integradas en Windows vistas en clase.", max:2, ref:"Lista cerrada: Microsoft Defender, Firewall de Windows, BitLocker, UAC, Windows Update",
   sets:[["microsoft defender","defender","antivirus"],["firewall","firewall de windows"],["bitlocker"],["uac","control de cuentas de usuario"],["windows update"]]},

  }
}

function slug(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
function normalizeText(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9\s\/]/g,"").trim().replace(/\s+/g," "); }
function normalizeCedula(s){ return (s||"").toUpperCase().replace(/[^0-9A-Z]/g,""); }

/* Mezcla determinista por estudiante: mismo estudiante = mismo orden siempre (persiste al recargar),
   distinto estudiante = distinto orden, para que no coincida con la persona de al lado. */
function hashSeed(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (h*31 + str.charCodeAt(i)) | 0; }
  return h >>> 0;
}
function mulberry32(seed){
  let a = seed;
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffledIndices(n, seedStr){
  const rng = mulberry32(hashSeed(seedStr));
  const idx = Array.from({length:n}, (_,i)=>i);
  for(let i=idx.length-1;i>0;i--){
    const j = Math.floor(rng()*(i+1));
    [idx[i],idx[j]] = [idx[j],idx[i]];
  }
  return idx;
}

/* ---------- calificación automática ---------- */
function scoreSU(answers){ let s=0; PART_SU.forEach(q=>{ if(answers[q.id]===q.correct) s++; }); return s; }
function scoreC(answers){ let s=0; PART_C_STATEMENTS.forEach((st,idx)=>{ if(answers[idx]===st.correct) s++; }); return s; }
function scoreRC(answers){
  let total=0; const perItem={};
  PART_RC.forEach(q=>{
    const arr = answers[q.id] || [];
    const used = new Set(); let count=0;
    for(let i=0;i<arr.length;i++){
      const norm = normalizeText(arr[i]); if(!norm) continue;
      for(let si=0; si<q.sets.length; si++){
        if(used.has(si)) continue;
        if(q.sets[si].some(k=>norm===k || norm.includes(k) || k.includes(norm))){ used.add(si); count++; break; }
      }
    }
    const qs = Math.min(count, q.max); perItem[q.id]=qs; total+=qs;
  });
  return {total, perItem};
}
function answeredCount(){
  let n=0;
  n += Object.keys(state.answers.su).length;
  n += Object.keys(state.answers.c).length;
  PART_RC.forEach(q=>{ const arr=state.answers.rc[q.id]||[]; for(let i=0;i<q.max;i++){ if((arr[i]||"").trim()) n++; } });
  return n;
}

async function startExam(){
  const idx = document.getElementById("in-alumno").value;
  const cedulaCheck = document.getElementById("in-cedula-check").value.trim();
  if(idx===""){ flash("Seleccioná tu nombre de la lista."); return; }
  const roster = STUDENT_ROSTER[parseInt(idx)];
  if(!cedulaCheck){ flash("Confirmá tu cédula o carné."); return; }
  if(normalizeCedula(cedulaCheck) !== normalizeCedula(roster.cedula)){ flash("La cédula no coincide con el nombre seleccionado. Revisá e intentá de nuevo."); return; }

  const fullName = roster.ap1+" "+roster.ap2+" "+roster.nombre;
  const id = roster.cedula;
  if(state.busy) return;
  state.busy = true; render();

  const [subResp, progResp] = await Promise.all([ getSubmissionRemote(id), getProgressRemote(id) ]);
  if(!subResp.ok){ state.busy=false; flash("No se pudo conectar con la base de datos. Esperá unos segundos y volvé a intentar."); render(); return; }
  if(subResp.value){
    state.submission = subResp.value; state.submissionId = id;
    state.student.nombre = fullName; state.student.cedula = roster.cedula; state.student.seccion = roster.seccion;
    state.busy = false; state.screen = "submitted"; render(); return;
  }
  state.student.nombre = fullName; state.student.cedula = roster.cedula; state.student.seccion = roster.seccion;

  if(progResp.ok && progResp.value){
    const p = progResp.value;
    state.answers = p.answers || {su:{}, rc:{}, c:{}};
    state.startTime = p.startTime || Date.now();
    state.suOrder = p.suOrder || null;
    state.cOrder = p.cOrder || null;
    state.rcOrder = p.rcOrder || null;
  }
  if(!state.startTime) state.startTime = Date.now();
  if(!state.suOrder) state.suOrder = shuffledIndices(PART_SU.length, roster.cedula+"-su");
  if(!state.cOrder) state.cOrder = shuffledIndices(PART_C_STATEMENTS.length, roster.cedula+"-c");
  if(!state.rcOrder) state.rcOrder = shuffledIndices(PART_RC.length, roster.cedula+"-rc");

  state.screen = "exam"; state.tabWarnings = 0; state.busy = false;
  saveProgress(); render(); startTimer();
}

function startTimer(){
  clearInterval(state.timerHandle);
  const durMs = (state.config.duracionMinutos||120)*60*1000;
  function tick(){
    const elapsed = Date.now() - state.startTime;
    const left = Math.max(0, durMs - elapsed);
    state.timeLeftSec = Math.floor(left/1000);
    const el = document.getElementById("timer-display");
    if(el){
      const m = Math.floor(state.timeLeftSec/60), s = state.timeLeftSec%60;
      el.textContent = (m<10?"0":"")+m+":"+(s<10?"0":"")+s;
      el.className = "timer" + (state.timeLeftSec<300 ? " warn" : "");
    }
    if(left<=0){ clearInterval(state.timerHandle); submitExam(true); }
  }
  tick(); state.timerHandle = setInterval(tick, 1000);
}

async function submitExam(auto){
  if(state.busy) return;
  if(!auto){
    const missing = TOTAL_ITEMS - answeredCount();
    if(missing>0){ const ok = confirm("Tenés "+missing+" ítem(s) sin responder. ¿Deseás entregar de todas formas?"); if(!ok) return; }
    else { const ok = confirm("¿Confirmás la entrega de la prueba? No podrás modificar tus respuestas después."); if(!ok) return; }
  }
  state.busy = true; render();
  clearInterval(state.timerHandle);

  const autoScoreSU = scoreSU(state.answers.su);
  const autoScoreC = scoreC(state.answers.c);
  const rcResult = scoreRC(state.answers.rc);
  const totalScore = autoScoreSU + autoScoreC + rcResult.total;

  const base = {
    nombre:state.student.nombre, cedula:state.student.cedula, seccion:state.student.seccion,
    timestamp:new Date().toISOString(), autoSubmitted: !!auto,
    answers: state.answers, tabWarnings: state.tabWarnings,
    autoScoreSU, autoScoreC, autoScoreRC: rcResult.total, rcScores: rcResult.perItem,
    graded:true, totalScore
  };

  if(state.previewMode){ state.submission = Object.assign({id:"preview"}, base); state.busy=false; state.screen="submitted"; render(); return; }

  const id = state.student.cedula;
  const submission = Object.assign({id}, base);

  let saved = false;
  for(let attempt=1; attempt<=2 && !saved; attempt++){
    const saveResp = await saveSubmissionRemote(submission);
    if(saveResp.ok){
      const verify = await getSubmissionRemote(id);
      if(verify.ok && verify.value && verify.value.timestamp === submission.timestamp){ saved = true; }
    }
    if(!saved && attempt<2) await sleep(600);
  }

  if(!saved){
    state.busy = false;
    flash("⚠ No se pudo confirmar que tu entrega quedó guardada. NO cierres esta ventana ni recargues — avisá a la persona docente de inmediato y mostrale esta pantalla.");
    render();
    return;
  }

  await deleteProgressRemote(id);
  state.submission = submission; state.submissionId = id;
  state.busy = false; state.screen = "submitted"; render();
}

/* Desglose de puntos por tema para una entrega — reutilizado en la vista del estudiante y en el análisis de grupo */
function computeTemaBreakdown(sub){
  const t = {};
  Object.keys(TEMA_NOMBRES).forEach(k=> t[k]={earned:0, possible:0});
  PART_SU.forEach(q=>{
    t[q.tema].possible += 1;
    if(sub.answers.su[q.id]===q.correct) t[q.tema].earned += 1;
  });
  PART_RC.forEach(q=>{
    t[q.tema].possible += q.max;
    const got = sub.rcScores && sub.rcScores[q.id]!=null ? sub.rcScores[q.id] : 0;
    t[q.tema].earned += got;
  });
  PART_C_STATEMENTS.forEach((s,idx)=>{
    t[s.tema].possible += 1;
    if(sub.answers.c[idx]===s.correct) t[s.tema].earned += 1;
  });
  return t;
}

function computeGradeExtras(totalScore, valorPorcentual){
  const notaCien = Math.round((totalScore/50)*100*100)/100;
  const pct = parseFloat(valorPorcentual);
  const valorGanado = isNaN(pct) ? null : Math.round((totalScore/50)*pct*100)/100;
  return {notaCien, valorGanado, pct: isNaN(pct)?null:pct};
}

  const csv = rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");

}

let flashTimeout=null;
function flash(msg){
  const el = document.getElementById("flash-msg"); if(!el){ alert(msg); return; }

}

function renderDifficulty(){
  const n = state.teacherSubs.length;
  const rowStyle = (pctBad)=> pctBad>=50? 'color:var(--danger);font-weight:600;' : pctBad>=25?'color:var(--gold);font-weight:600;':'color:var(--good);';

  const suStats = PART_SU.map(q=>{
    let wrong=0, answered=0;
    state.teacherSubs.forEach(s=>{ const given=s.answers.su[q.id]; if(given){ answered++; if(given!==q.correct) wrong++; } });
    return {id:q.id, text:q.text, pctWrong: answered>0?Math.round((wrong/answered)*100):0};
  }).sort((a,b)=> b.pctWrong-a.pctWrong);

  const rcStats = PART_RC.map(q=>{
    let sum=0, count=0;
    state.teacherSubs.forEach(s=>{ if(s.rcScores && s.rcScores[q.id]!=null){ sum+=s.rcScores[q.id]; count++; } });
    const avgPct = count>0? Math.round((sum/count/q.max)*100) : 0;
    return {id:q.id, text:q.text, avgPct};
  }).sort((a,b)=> a.avgPct-b.avgPct);

  const cStats = PART_C_STATEMENTS.map((st,idx)=>{
    let wrong=0, answered=0;
    state.teacherSubs.forEach(s=>{ const given=s.answers.c[idx]; if(given){ answered++; if(given!==st.correct) wrong++; } });
    return {idx, text:st.text, pctWrong: answered>0?Math.round((wrong/answered)*100):0};
  }).sort((a,b)=> b.pctWrong-a.pctWrong);

  const suRows = suStats.map(x=> `<tr><td class="mono">SU ${x.id}</td><td>${esc(x.text)}</td><td style="${rowStyle(x.pctWrong)}">${x.pctWrong}% falló</td></tr>`).join("");
  const rcRows = rcStats.map(x=> `<tr><td class="mono">RC ${x.id}</td><td>${esc(x.text)}</td><td style="${rowStyle(100-x.avgPct)}">${x.avgPct}% del puntaje promedio</td></tr>`).join("");
  const cRows = cStats.map(x=> `<tr><td class="mono">C ${x.idx+1}</td><td>${esc(x.text)}</td><td style="${rowStyle(x.pctWrong)}">${x.pctWrong}% falló</td></tr>`).join("");

  return `${logoHeader()}<div class="topbar"><div class="topbar-inner"><div class="brand">Dificultad por pregunta<small>Ciberseguridad — ordenado de más a menos difícil</small></div><button class="btn btn-ghost-nav btn-small" data-action="to-dashboard">Volver al panel</button></div></div>
  <div class="wrap">
    ${n===0? '<div class="tpanel"><p style="color:var(--slate);">Todavía no hay entregas para analizar.</p></div>' : `
    <div class="tpanel"><h3>Selección Única</h3><div style="overflow-x:auto;"><table class="subs"><thead><tr><th>Ítem</th><th>Enunciado</th><th>Dificultad</th></tr></thead><tbody>${suRows}</tbody></table></div></div>
    <div class="tpanel"><h3>Respuesta Corta</h3><div style="overflow-x:auto;"><table class="subs"><thead><tr><th>Ítem</th><th>Enunciado</th><th>Dificultad</th></tr></thead><tbody>${rcRows}</tbody></table></div></div>
    <div class="tpanel"><h3>Correspondencia</h3><div style="overflow-x:auto;"><table class="subs"><thead><tr><th>Ítem</th><th>Enunciado</th><th>Dificultad</th></tr></thead><tbody>${cRows}</tbody></table></div></div>
    `}
  </div>`;
}

function renderPrintable(){
  const c = state.config;
  const su = PART_SU.map(q=>{
    const opts = q.options.map(([k,l])=>`<div>( &nbsp;&nbsp;) ${k}) ${esc(l)}</div>`).join("");
    const codeHtml = q.code ? `<div class="code-box" style="background:#111;">${q.code.map(l=>esc(l)).join("\n")}</div>` : "";
    return `<div class="print-q"><span class="qn">${q.id}.</span>${esc(q.text)}${codeHtml}<div class="print-opts">${opts}</div></div>`;
  }).join("");
  const rc = PART_RC.map(q=>{
    const blanks = Array.from({length:q.max},(_,i)=>`<div>${i+1}) <span class="print-blank">&nbsp;</span></div>`).join("");
    return `<div class="print-q"><span class="qn">${q.id}.</span>${esc(q.text)} <em>(${q.max} pts)</em><div class="print-opts">${blanks}</div></div>`;
  }).join("");
  const colAList = PART_C_COLA.map(([k,l])=>`<div>${k}. ${esc(l)}</div>`).join("");
  const cRows = PART_C_STATEMENTS.map((s,idx)=>`<div class="print-match"><span class="paren">( &nbsp;&nbsp; )</span> <span>${idx+1}. ${esc(s.text)}</span></div>`).join("");

  const specT = computeSpecTable();
  const lecciones = c.lecciones || {};
  let totalPts = 0;
  const specRows = Object.keys(TEMA_NOMBRES).map(k=>{
    const row = specT[k]; const pts = row.su+row.rc+row.c; totalPts += pts;
    return `<tr><td>${esc(TEMA_NOMBRES[k])}</td><td>${esc(lecciones[k]||"—")}</td><td>${row.su}</td><td>${row.rc}</td><td>${row.c}</td><td>${pts}</td></tr>`;
  }).join("");

  return `
    <div class="print-toolbar"><button class="btn btn-ghost btn-small" data-action="to-dashboard">Volver al panel</button><button class="btn btn-gold btn-small" data-action="do-print">Imprimir / Guardar como PDF</button></div>
    <div class="print-page">
      <div class="print-header">
        <img src="data:image/jpeg;base64,${LOGO_B64}" alt="Escudo CTP Mercedes Norte" style="height:72px;width:auto;aspect-ratio:616/756;object-fit:contain;display:block;margin:0 auto 8px;" />
        <div style="font-size:12px;">${esc(c.institucion)}</div><h1>${esc(c.asignatura)}</h1><div class="sub">${esc(c.subarea)}</div>
        <div style="font-size:12px;color:#444;margin-top:4px;">${esc(c.docente)}</div>
      </div>
      <div class="print-admin">
        <div>Docente: ${esc(c.docente)}</div><div>Nivel: ${esc(c.nivel)}</div>
        <div>Secciones: ${esc(c.seccion)}</div><div>Fecha: ${esc(c.fecha||"__________________")}</div>
        <div>Duración: ${esc(c.duracionMinutos)} minutos</div><div>Puntuación total: 50 puntos</div>
        <div>Valor porcentual: ${esc(c.valorPorcentual)}%</div><div>Puntos obtenidos: __________</div>
        <div>Nombre del estudiante: ________________________________</div><div>Calificación (0-100): __________</div>
      </div>
      <div class="print-section-title">SU — SELECCIÓN ÚNICA (25 puntos)</div>
      <div class="print-instr">Escriba una equis sobre la opción correcta.</div>${su}
      <div style="page-break-before:always;"></div>
      <div class="print-section-title">RC — RESPUESTA CORTA (15 puntos)</div>
      <div class="print-instr">Anote la cantidad de elementos solicitada en cada pregunta.</div>${rc}
      <div class="print-section-title">C — CORRESPONDENCIA (10 puntos)</div>
      <div class="print-instr">Escriba la letra correspondiente dentro del paréntesis.</div>
      <div class="print-cols"><div class="colA" style="padding:10px 14px;"><strong>Columna A</strong>${colAList}</div><div class="colB"><strong>Columna B</strong>${cRows}</div></div>
      <div style="page-break-before:always;"></div>
      <div class="print-section-title">TABLA DE ESPECIFICACIONES</div>
      <div class="print-spec"><table><thead><tr><th>Aprendizaje</th><th>Lecciones</th><th>SU</th><th>RC</th><th>C</th><th>Pts</th></tr></thead>
      <tbody>${specRows}<tr><td colspan="5" style="text-align:right;"><strong>Total</strong></td><td><strong>${totalPts}</strong></td></tr></tbody></table></div>
    </div>`;
}


function renderTeacherDashboard(){
  const c = state.config;
  const rows = state.teacherSubs.map(s=>{
    const expanded = state.teacherExpanded===s.id;
    let detail = "";
    if(expanded){
      const suList = PART_SU.map(q=>{
        const given = s.answers.su[q.id]; const ok = given===q.correct;
        return `<div class="a-item" style="display:flex;justify-content:space-between;"><span>${q.id}. respondió <strong>${given||"—"}</strong> (correcta: ${q.correct})</span><span style="color:${ok?'var(--good)':'var(--danger)'};font-weight:600;">${ok?"✓":"✗"}</span></div>`;
      }).join("");
      const rcList = PART_RC.map(q=>{
        const arr = s.answers.rc[q.id]||[];
        const lines = Array.from({length:q.max},(_,i)=>`<div>${i+1}) ${esc(arr[i]||"— sin respuesta —")}</div>`).join("");
        const autoScore = s.rcScores && s.rcScores[q.id]!=null ? s.rcScores[q.id] : 0;
        return `<div class="a-item">
          <div class="prompt">${q.id}. ${esc(q.text)} <span class="hint">Referencia: ${esc(q.ref)}</span></div>
          ${lines}
          <div style="margin-top:6px;display:flex;align-items:center;gap:6px;">
            <span>Puntos (máx. ${q.max}):</span>
            <button type="button" class="btn btn-ghost btn-small" data-action="score-dec" data-target="g-rc-${s.id}-${q.id}" data-max="${q.max}" style="padding:4px 10px;">−</button>
            <input type="number" min="0" max="${q.max}" step="0.5" class="grade-input" id="g-rc-${s.id}-${q.id}" value="${autoScore}" style="width:56px;text-align:center;" />
            <button type="button" class="btn btn-ghost btn-small" data-action="score-inc" data-target="g-rc-${s.id}-${q.id}" data-max="${q.max}" style="padding:4px 10px;">+</button>
          </div>
        </div>`;
      }).join("");
      const cList = PART_C_STATEMENTS.map((st,idx)=>{
        const given = s.answers.c[idx]; const ok = given===st.correct;
        return `<div class="a-item" style="display:flex;justify-content:space-between;"><span>${idx+1}. respondió <strong>${given||"—"}</strong> (correcta: ${st.correct})</span><span style="color:${ok?'var(--good)':'var(--danger)'};font-weight:600;">${ok?"✓":"✗"}</span></div>`;
      }).join("");
      detail = `<tr><td colspan="4"><div class="detail">
        <h4>SU — detalle (auto: ${s.autoScoreSU}/25)</h4>${suList}
        <h4>RC — detalle, autocalificada (auto: ${s.autoScoreRC}/15)</h4>${rcList}
        <h4>C — detalle (auto: ${s.autoScoreC}/10)</h4>${cList}
        <div class="rubric" style="margin-top:14px;">
          <div class="rubric-title">Ajustar puntos manualmente (por si hay una apelación válida)</div>
          <div style="display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;">
            <div>SU (máx. 25): <input type="number" min="0" max="25" step="0.5" class="grade-input" id="g-su-${s.id}" value="${s.autoScoreSU}" /></div>
            <div>C (máx. 10): <input type="number" min="0" max="10" step="0.5" class="grade-input" id="g-c-${s.id}" value="${s.autoScoreC}" /></div>
          </div>
        </div>
        <div style="margin-top:14px;display:flex;gap:10px;">
          <button class="btn btn-gold btn-small" data-action="save-grade" data-id="${s.id}" ${state.busy?'disabled':''}>${state.busy?'Guardando…':'Guardar cambios'}</button>
          <button class="btn btn-ghost btn-small" data-action="collapse">Cerrar</button>
        </div>
      </div></td></tr>`;
    }
    const extras = computeGradeExtras(s.totalScore, c.valorPorcentual);
    return `<tr>
      <td>${esc(s.nombre)}<div class="hint mono" style="margin-top:2px;">${esc(s.cedula)} · ${esc(s.seccion||"")}</div></td>
      <td><strong style="font-size:20px;color:var(--navy-2);">${extras.notaCien}</strong><span class="hint"> / 100</span><div class="hint" style="margin-top:2px;">SU:${s.autoScoreSU}/25 · RC:${s.autoScoreRC}/15 · C:${s.autoScoreC}/10 · ${s.totalScore}/50${extras.valorGanado!=null? ' · '+extras.valorGanado+'% del '+extras.pct+'%':''}</div></td>
      <td>${s.tabWarnings ? '<span class="badge pend">'+s.tabWarnings+'</span>' : '—'}</td>
      <td style="white-space:nowrap;"><button class="btn btn-ghost btn-small" data-action="expand" data-id="${s.id}">${expanded?'Ocultar':'Ver'}</button><button class="btn btn-danger btn-small" data-action="delete-sub" data-id="${s.id}">Eliminar</button></td>
    </tr>${detail}`;
  }).join("") || `<tr><td colspan="4" style="text-align:center;color:var(--slate);padding:24px;">Aún no hay entregas registradas.</td></tr>`;

  return `
    ${logoHeader()}
    <div class="topbar"><div class="topbar-inner"><div class="brand">Panel docente<small>Ciberseguridad — 10-3</small></div><button class="btn btn-ghost-nav btn-small" data-action="back">Salir</button></div></div>
    <div class="wrap">
      <div class="tpanel">
        <div class="toggle-row">
          <div class="switch ${c.enabled?'on':''}" data-action="toggle-enabled"><div class="knob"></div></div>
          <div><strong>${c.enabled? "Prueba habilitada" : "Prueba deshabilitada"}</strong></div>
          <button class="btn btn-ghost btn-small" style="margin-left:auto;" data-action="reload-config">Recargar estado</button>
        </div>
        <div class="toggle-row">
          <div class="switch ${c.revelarRespuestas?'on':''}" data-action="toggle-reveal"><div class="knob"></div></div>
          <div><strong>${c.revelarRespuestas? "Respuestas correctas visibles para estudiantes" : "Respuestas correctas ocultas"}</strong> <span class="hint">(en su pantalla de resultado, después de entregar)</span></div>
        </div>
        <button class="btn btn-gold btn-small" style="margin-bottom:10px;" data-action="preview-exam">Vista previa del examen (como estudiante)</button>
        <div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;">
          <button class="btn btn-ghost btn-small" data-action="view-spec-table">Tabla de especificaciones</button>
          <button class="btn btn-ghost btn-small" data-action="view-answer-key">Clave de respuestas completa</button>
          <button class="btn btn-ghost btn-small" data-action="view-printable">Descargar examen en PDF</button>
          <button class="btn btn-ghost btn-small" data-action="view-tema-analysis">Análisis por tema (grupo)</button>
          <button class="btn btn-ghost btn-small" data-action="view-difficulty">Dificultad por pregunta</button>
        </div>
        <h3>Datos de la prueba</h3>
        <div class="grid2">
          <div class="field"><label>Institución</label><input type="text" id="cfg-institucion" value="${esc(c.institucion)}" /></div>
          <div class="field"><label>Asignatura</label><input type="text" id="cfg-asignatura" value="${esc(c.asignatura)}" /></div>
          <div class="field"><label>Subárea</label><input type="text" id="cfg-subarea" value="${esc(c.subarea)}" /></div>
          <div class="field"><label>Docente</label><input type="text" id="cfg-docente" value="${esc(c.docente)}" /></div>
          <div class="field"><label>Nivel</label><input type="text" id="cfg-nivel" value="${esc(c.nivel)}" /></div>
          <div class="field"><label>Secciones</label><input type="text" id="cfg-seccion" value="${esc(c.seccion)}" /></div>
          <div class="field"><label>Fecha</label><input type="text" id="cfg-fecha" placeholder="dd/mm/aaaa" value="${esc(c.fecha)}" /></div>
          <div class="field"><label>Duración (minutos)</label><input type="text" id="cfg-duracion" value="${esc(c.duracionMinutos)}" /></div>
          <div class="field"><label>Valor porcentual (%)</label><input type="text" id="cfg-valor" value="${esc(c.valorPorcentual)}" /></div>
        </div>
        <button class="btn btn-gold" data-action="save-config">Guardar configuración</button>
      </div>
      <div class="tpanel">
        <div class="toolbar"><h3 style="margin:0;">Entregas (${state.teacherSubs.length})</h3>
          <div style="display:flex;gap:8px;"><button class="btn btn-ghost btn-small" data-action="refresh-subs">Actualizar</button><button class="btn btn-ghost btn-small" data-action="export-csv">Exportar CSV</button></div></div>
        <div style="overflow-x:auto;"><table class="subs"><thead><tr><th>Estudiante</th><th>Nota</th><th>Cambios vent.</th><th>Acciones</th></tr></thead><tbody>${rows}</tbody></table></div>
      </div>
    </div>
    <div id="flash-msg" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:4px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);"></div>
  `;
}

function render(){
  const app = document.getElementById("app");
  let html = "";
  if(state.screen==="loading") html = `<div class="wrap" style="padding:60px 20px;text-align:center;color:var(--slate);">${esc(state.loadingMsg)}</div>`;
  else if(state.screen==="backendMissing") html = renderBackendMissing();
  else if(state.screen==="landing") html = renderLanding();
  else if(state.screen==="exam") html = renderExam();
  else if(state.screen==="submitted") html = renderSubmitted();
  else if(state.screen==="teacherLogin") html = renderTeacherLogin();
  else if(state.screen==="teacherDashboard") html = renderTeacherDashboard();
  else if(state.screen==="teacherSpecTable") html = renderSpecTable();
  else if(state.screen==="teacherAnswerKey") html = renderAnswerKey();
  else if(state.screen==="teacherPrintable") html = renderPrintable();
  else if(state.screen==="teacherTemaAnalysis") html = renderTemaAnalysis();
  else if(state.screen==="teacherDifficulty") html = renderDifficulty();
  app.innerHTML = html;
  if(state.screen==="exam"){ startTimer(); updateMatchOptions(); }
}

document.addEventListener("click", (e)=>{
  const t = e.target.closest("[data-action]"); if(!t) return;
  const action = t.getAttribute("data-action"); const id = t.getAttribute("data-id");
  if(action==="start") startExam();
  else if(action==="submit") submitExam(false);
  else if(action==="teacher-login") goTeacherLogin();
  else if(action==="teacher-submit") attemptTeacherLogin();
  else if(action==="back") backToLanding();
  else if(action==="toggle-enabled") toggleEnabled();
  else if(action==="toggle-reveal") toggleReveal();
  else if(action==="view-tema-analysis") viewTemaAnalysis();
  else if(action==="view-difficulty") viewDifficulty();
  else if(action==="save-config") saveConfig();
  else if(action==="reload-config") reloadConfig();
  else if(action==="preview-exam") previewExam();
  else if(action==="exit-preview") exitPreview();
  else if(action==="to-dashboard") toDashboard();
  else if(action==="view-spec-table") viewSpecTable();
  else if(action==="view-answer-key") viewAnswerKey();
  else if(action==="view-printable") viewPrintable();
  else if(action==="do-print") doPrint();
  else if(action==="save-spec-table") saveSpecTable();
  else if(action==="download-copy") downloadStudentCopy();
  else if(action==="dismiss-cheat") dismissCheatWarning();
  else if(action==="end-exam-now") endExamNow();
  else if(action==="refresh-subs") loadTeacherSubs().then(render);
  else if(action==="export-csv") exportCSV();
  else if(action==="expand") toggleExpand(id);
  else if(action==="collapse") toggleExpand(state.teacherExpanded);
  else if(action==="save-grade") saveGrade(id);
  else if(action==="score-inc" || action==="score-dec"){
    const el = document.getElementById(t.getAttribute("data-target"));
    if(el){
      const max = parseFloat(t.getAttribute("data-max"))||0;
      let v = parseFloat(el.value); if(isNaN(v)) v=0;
      v += action==="score-inc" ? 0.5 : -0.5;
      v = Math.max(0, Math.min(max, Math.round(v*2)/2));
      el.value = v;
    }
  }
  else if(action==="delete-sub") deleteSubmission(id);
});
document.addEventListener("change", (e)=>{
  const t = e.target; const action = t.getAttribute && t.getAttribute("data-action");
  if(action==="ans-su"){ state.answers.su[t.getAttribute("data-id")] = t.value; scheduleSaveProgress(); updateProgressBadge(); }
  else if(action==="ans-c"){ state.answers.c[t.getAttribute("data-id")] = t.value; scheduleSaveProgress(); updateProgressBadge(); updateMatchOptions(); }
});
document.addEventListener("input", (e)=>{
  const t = e.target; const action = t.getAttribute && t.getAttribute("data-action");
  if(action==="ans-rc"){
    const qid = t.getAttribute("data-id"); const idx = parseInt(t.getAttribute("data-idx"));
    if(!state.answers.rc[qid]) state.answers.rc[qid] = [];
    state.answers.rc[qid][idx] = t.value; scheduleSaveProgress(); updateProgressBadge();
  }
});
function updateProgressBadge(){ const el = document.querySelector(".progress-badge"); if(el) el.textContent = "· "+answeredCount()+"/"+TOTAL_ITEMS+" respondidas"; }

function updateMatchOptions(){
  const used = PART_C_STATEMENTS.map((_,i)=> state.answers.c[i]).filter(v=>v);
  PART_C_STATEMENTS.forEach((s,i)=>{
    const sel = document.querySelector('select[data-action="ans-c"][data-id="'+i+'"]');
    if(!sel) return;
    const current = state.answers.c[i] || "";
    const opts = ['<option value="">—</option>'];
    PART_C_COLA.forEach(([k,l])=>{
      if(used.includes(k) && k!==current) return;
      opts.push('<option value="'+k+'" '+(k===current?"selected":"")+'>'+k+' — '+esc(l)+'</option>');
    });
    sel.innerHTML = opts.join("");
  });
}

init();

</script>
